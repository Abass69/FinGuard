[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "finguard-research"
version = "0.1.0"
description = "Causal temporal graph features for synthetic financial network risk detection"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "xgboost>=3,<4", "networkx>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.42,<2", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["finguard*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
